[package]
name = "tson-rust"
edition = "2024"
description = "TSON (Typed JSON) parser implementation in Rust"
license = "MIT"

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
criterion = "0.5"
regex = "1.11.1"

[profile.release]
debug = true

[profile.bench]
debug = true

[[bench]]
name = "json_vs_tson"
harness = false
